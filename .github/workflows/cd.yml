name: CD Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ==========================================================
  # 1. Verification Stage (Ensure tests & E2E pass before deploying)
  # ==========================================================
  verify:
    name: Verify Tests & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v ./tests/...

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm ci
          npx tsc --noEmit
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E UI Tests
        run: |
          cd frontend
          CI_RUN_SERVER=true npm run test:e2e

  # ==========================================================
  # 2. Deployment Stage (Auto-Deploy to VPS on Merge to Main)
  # ==========================================================
  deploy-vps:
    name: Deploy to Production VPS
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Deployment Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
            echo "VPS Deployment Secrets are present."
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::warning::VPS_HOST and/or VPS_SSH_KEY secrets are not configured in GitHub Repository Settings. Skipping SSH deployment step."
          fi

      - name: Deploy via SSH to VPS
        if: steps.check_secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Starting Auto-Deployment on VPS..."
            
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH || '/home/ubuntu/apps/teman-mancing' }}"
            if [ ! -d "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="$HOME/apps/teman-mancing"
            fi
            if [ ! -d "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="$HOME/teman-mancing"
            fi
            
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "Creating deployment directory at $DEPLOY_PATH..."
              git clone https://github.com/${{ github.repository }}.git "$DEPLOY_PATH"
            fi
            
            cd "$DEPLOY_PATH"
            
            echo "📥 Pulling latest commits from origin/main..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "⚙️ Executing deployment script..."
            chmod +x infrastructure/scripts/deploy.sh
            ./infrastructure/scripts/deploy.sh
            
            echo "✅ [CI/CD] Auto-Deployment successfully completed!"

  # ==========================================================
  # 3. Notification Stage (Telegram Alerts on Success & Error)
  # ==========================================================
  notify-telegram:
    name: Notify Status to Telegram
    needs: [verify, deploy-vps]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy-vps.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set, skipping notification."
            exit 0
          fi

          if [ "$VERIFY_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            MSG="🎉 *[DEPLOY SELESAI] Teman Mancing VPS*%0A%0A"
            MSG+="📦 *Repo:* \`${{ github.repository }}\`%0A"
            MSG+="🌿 *Branch:* \`main\`%0A"
            MSG+="👤 *Deployer:* ${{ github.actor }}%0A"
            MSG+="📝 *Commit:* ${{ github.event.head_commit.message || github.sha }}%0A%0A"
            MSG+="✅ *Status:* Seluruh tahapan pengujian & deploy sukses!%0A"
            MSG+="🌐 *Web Frontend (HTTPS):* https://temanmancing.my.id%0A"
            MSG+="📱 *Port Fallback:* http://43.173.39.59:3003%0A"
            MSG+="🔌 *Backend API:* https://temanmancing.my.id/api/v1%0A"
            MSG+="💾 *MinIO Console:* http://43.173.39.59:9001"
          else
            MSG="❌ *[DEPLOY GAGAL] Teman Mancing VPS*%0A%0A"
            MSG+="📦 *Repo:* \`${{ github.repository }}\`%0A"
            MSG+="🌿 *Branch:* \`main\`%0A"
            MSG+="👤 *Actor:* ${{ github.actor }}%0A"
            MSG+="⚠️ *Verify / E2E:* \`${VERIFY_RESULT}\`%0A"
            MSG+="⚠️ *VPS Deploy:* \`${DEPLOY_RESULT}\`%0A%0A"
            MSG+="🔗 *Periksa Log:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
