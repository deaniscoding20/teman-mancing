name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # 1. Backend CI (Golang 1.23)
  # ==========================================================
  backend-test:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Download Go Dependencies
        run: |
          cd backend
          go mod download

      - name: Run Backend Unit & Integration Tests
        run: |
          cd backend
          go test -v -race ./tests/...

      - name: Build Go Static Binary
        run: |
          cd backend
          CGO_ENABLED=0 go build -ldflags="-w -s" -o bin/api ./cmd/api

  # ==========================================================
  # 2. Frontend CI (Next.js 14 + TypeScript)
  # ==========================================================
  frontend-test:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Type Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Next.js Production Build
        run: |
          cd frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws

  # ==========================================================
  # 3. Playwright E2E UI Tests
  # ==========================================================
  e2e-playwright:
    name: Playwright E2E UI Tests
    needs: [frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Build Next.js App for Testing
        run: |
          cd frontend
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws

      - name: Run Playwright E2E Tests
        run: |
          cd frontend
          CI_RUN_SERVER=true npm run test:e2e

      - name: Upload Playwright Test Report (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ==========================================================
  # 4. Docker Compose Config Validation
  # ==========================================================
  docker-validate:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Compose File Syntax
        run: |
          docker compose -f infrastructure/docker/docker-compose.yml config > /dev/null

  # ==========================================================
  # 5. Telegram Notification on CI Failure
  # ==========================================================
  notify-ci-failure:
    name: Notify CI Failure on Telegram
    needs: [backend-test, frontend-test, e2e-playwright, docker-validate]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Failure Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="🚨 *[CI GAGAL] Teman Mancing Pipeline*%0A%0A"
            MSG+="📦 *Repo:* \`${{ github.repository }}\`%0A"
            MSG+="🌿 *Branch:* \`${{ github.ref_name }}\`%0A"
            MSG+="👤 *Author:* ${{ github.actor }}%0A"
            MSG+="📝 *Commit:* ${{ github.event.head_commit.message || github.sha }}%0A%0A"
            MSG+="❌ Tahapan CI (Test / Build / Playwright E2E) mengalami kegagalan!%0A"
            MSG+="🔗 *Lihat Log:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=Markdown" > /dev/null || true
          fi
